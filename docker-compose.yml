# ---------------------------------------------------------------------------
# Standard:            docker compose up --build
#   -> API (http://127.0.0.1:8001) und Frontend (http://127.0.0.1:3001) im
#      Container, Ollama läuft auf dem Host (host.docker.internal).
#      127.0.0.1 statt localhost: Windows löst localhost bevorzugt nach ::1 auf.
#
# Vollständiger Stack: docker compose --profile full up --build
#   -> zusätzlich ein Ollama-Container; Modell danach einmalig ziehen mit
#      docker compose exec ollama ollama pull qwen2.5:14b-instruct
# ---------------------------------------------------------------------------
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-compliance-agent:latest
    container_name: compliance-agent-api
    restart: unless-stopped
    ports:
      # Host 8001 -> Container 8000 (Standard: nur lokal erreichbar; BIND_HOST=0.0.0.0 öffnet fürs Netz).
      - "${BIND_HOST:-127.0.0.1}:8001:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/agent.db}
      UPLOAD_DIR: data/uploads
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b-instruct}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}
      MASK_PII_IN_STORAGE: ${MASK_PII_IN_STORAGE:-true}
      PII_STRICTNESS: ${PII_STRICTNESS:-standard}
      INFERENCE_MODE: ${INFERENCE_MODE:-local}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      LLM_RETRY_DELAYS: ${LLM_RETRY_DELAYS:-2,5}
      HEURISTIC_FALLBACK: ${HEURISTIC_FALLBACK:-true}
      CLOUD_DAILY_TOKEN_LIMIT: ${CLOUD_DAILY_TOKEN_LIMIT:--1}
      ANALYSIS_WORKERS: ${ANALYSIS_WORKERS:-1}
      DLP_TERMS: ${DLP_TERMS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Im Container gibt es kein lokales Ollama-Programm: Start/Stopp über den Dienst unten.
      RUNNING_IN_CONTAINER: "1"
    volumes:
      # Benanntes Volume statt Bind-Mount: Docker übernimmt beim ersten Start
      # Inhalt und Besitzrechte (appuser, UID 10001) aus dem Image. Ein
      # Bind-Mount von ./data scheitert auf Linux-Hosts an fehlenden
      # Schreibrechten ("unable to open database file").
      - app-data:/srv/app/data
    extra_hosts:
      # Erlaubt den Zugriff auf einen Ollama-Dienst des Hosts unter Linux.
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Adresse, unter der der *Browser* die API erreicht.
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://127.0.0.1:8001}
    image: enterprise-compliance-frontend:latest
    container_name: compliance-agent-frontend
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:3001:3001"
    depends_on:
      api:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: compliance-agent-ollama
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:11434:11434"
    environment:
      # 32k Kontext eines 14B-Modells in 16 GB Grafikspeicher.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ollama-models:/root/.ollama

volumes:
  app-data:
  ollama-models:
